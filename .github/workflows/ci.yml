name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  ios:
    runs-on: macos-15
    permissions:
      contents: write   # 스크린샷을 screenshots 브랜치에 올리기 위해
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          phones = [d for d in devices if d["name"].startswith("iPhone")]
          pro = [d for d in phones if re.fullmatch(r"iPhone \d+ Pro", d["name"])]
          print((pro or phones)[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      # 서명 없이 시뮬레이터용으로 빌드한다.
      # 경고·오류는 GitHub 주석(annotation)으로 남겨서 API로도 읽을 수 있게 한다.
      - name: Build
        run: |
          xcodebuild build \
            -project LectureNotes.xcodeproj \
            -scheme LectureNotes \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "^/.+:[0-9]+:[0-9]+: (warning|error): " build.log | sort -u | head -50 | \
            sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)#::\4 file=\1,line=\2,col=\3::\5#" || true
          echo "::notice::compiled Swift files: $(grep -cE '^SwiftCompile normal [^ ]+ .*\.swift' build.log || true)"
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log
      # 데모 모드로 화면마다 실행해서 스크린샷을 찍고 screenshots 브랜치에 올린다
      - name: Screenshots
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/LectureNotes.app
          mkdir -p shots
          shoot() {  # 화면 이름, 파일 이름
            xcrun simctl launch --terminate-running-process "$UDID" com.example.lecturenotes \
              -demoScreen "$1" -AppleLanguages "(ko)" -AppleLocale ko_KR
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$2.png"
          }
          for screen in empty list detail lecture recording summary; do shoot "$screen" "$screen"; done
          # 실시간으로 필기가 붙는 장면은 동영상으로 남긴다
          xcrun simctl terminate "$UDID" com.example.lecturenotes || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/live.mp4 &
          VIDEO_PID=$!
          sleep 2
          xcrun simctl launch "$UDID" com.example.lecturenotes -demoScreen live -AppleLanguages "(ko)" -AppleLocale ko_KR
          sleep 34
          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          xcrun simctl io "$UDID" screenshot shots/live-end.png
          # 다크 모드
          xcrun simctl ui "$UDID" appearance dark
          shoot lecture lecture-dark
          shoot summary summary-dark
          cd shots
          git init -q -b screenshots
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
