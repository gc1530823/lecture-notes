name: Android

# 안드로이드 앱(APK)을 만든다. Mac·개발자 계정 없이 GitHub에서 빌드하고, 핸드폰에서 바로 받아 깔 수 있게
# "android-latest" 릴리스에 APK를 올린다 (핸드폰 브라우저로 GitHub에 로그인한 채 릴리스 페이지에서 받기).
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  # 폰 안 받아쓰기 엔진(sherpa-onnx AAR)을 받는다. 남의 파일이라 서명 키 같은 Secrets가 없는 칸에서 받고,
  # 정해 둔 버전과 지문(android/sherpa-onnx.sha256)이 맞을 때만 빌드에 넘긴다.
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Download sherpa-onnx AAR
        run: |
          VERSION=$(cat android/sherpa-onnx.version)
          curl -fsSL -o sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VERSION/sherpa-onnx-$VERSION.aar"
          ls -la sherpa-onnx.aar
          SUM=$(sha256sum sherpa-onnx.aar | cut -d' ' -f1)
          echo "sherpa-onnx $VERSION sha256: $SUM"
          if [ -s android/sherpa-onnx.sha256 ]; then
            [ "$SUM" = "$(cat android/sherpa-onnx.sha256)" ] || { echo "::error::sherpa-onnx 파일 지문이 달라요 (바뀐 파일일 수 있어 멈춤)"; exit 1; }
          else
            echo "::warning::지문 파일이 없어 이번 지문을 android/sherpa-onnx.sha256 에 적어 두세요: $SUM"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-aar
          path: sherpa-onnx.aar

  build:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sherpa-onnx-aar
          path: android/app/libs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Signing key (if saved in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "저장된 서명 키로 서명합니다"
          else
            echo "서명 키가 없어 임시 키로 서명합니다 (새 버전은 지우고 다시 깔아야 해요)"
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk lecture-notes.apk && ls -la lecture-notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-notes-apk
          path: lecture-notes.apk
      - name: Publish to android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="강의노트 안드로이드 앱 (빌드 ${{ github.run_number }}, $(git log -1 --format=%h)). 핸드폰에서 lecture-notes.apk 를 받아 열면 설치돼요. 처음엔 '출처를 알 수 없는 앱' 허용이 필요해요."
          if gh release view android-latest > /dev/null 2>&1; then
            gh release upload android-latest lecture-notes.apk --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest lecture-notes.apk --title "안드로이드 앱 (최신)" --notes "$NOTES" --prerelease
          fi
