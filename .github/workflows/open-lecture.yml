name: Open lecture test

# 공개 강의(재사용이 허락된 것)로 실제 품질을 잰다: 슬라이드 PDF + 강의 영상 → 받아쓰기·필기·요약·정리 PDF,
# 공식 자막이 있으면 받아쓰기 정확도(WER)까지. 결과는 result/<이름> 브랜치에.
# 기본값: MIT OpenCourseWare 6.0001 (Fall 2016) 1강 "What is Computation?" — CC BY-NC-SA 4.0, 비영리 테스트용
# 유튜브 영상은 약관상 내려받지 않는다 (MIT OCW는 archive.org 사본 mp4를 함께 공개한다).
on:
  # 하루 한 강의씩 자동으로 (Groq 무료 한도가 하루 20만 토큰이라 한 번에 많이 못 한다). 강의 번호는 날짜로 돌아가며 고른다
  schedule:
    - cron: "17 19 * * *"   # 매일 한국 시각 새벽 4시 17분
  workflow_dispatch:
    inputs:
      discover:
        description: "과목 목록에서 가능한 강의만 확인하고 끝내기 (처리 안 함)"
        type: boolean
        default: false
      lecture:
        description: "MIT 6.0001 강의 번호 (1~12). 넣으면 아래 slides·video 대신 과목에서 찾는다"
        default: ""
      name:
        description: "결과 이름"
        default: "mit-6.0001-lec1"
      slides:
        description: "슬라이드 PDF 주소 또는 그 링크가 있는 페이지"
        default: "https://ocw.mit.edu/courses/6-0001-introduction-to-computer-science-and-programming-in-python-fall-2016/resources/mit6_0001f16_lec1/"
      video:
        description: "mp4 주소 또는 영상 페이지 (페이지에서 mp4·자막 링크를 찾는다)"
        default: "https://ocw.mit.edu/courses/6-0001-introduction-to-computer-science-and-programming-in-python-fall-2016/resources/lecture-1-what-is-computation/"
      minutes:
        description: "앞에서부터 몇 분만 쓸지 (Groq 무료 한도 때문에 15분 정도 권장, 0 = 전체)"
        default: "15"

concurrency: training-data

jobs:
  discover:
    if: ${{ inputs.discover }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python server/scripts/fetch_open_lecture.py --discover server/scripts/open_courses.txt

  run:
    if: ${{ !inputs.discover }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r server/requirements.txt && sudo apt-get install -y -q ffmpeg > /dev/null
      - name: Restore training data
        run: |
          mkdir -p server/data/training
          if git fetch -q --depth 1 origin training-data 2>/dev/null; then
            git archive origin/training-data raw | tar -x -C server/data/training --strip-components=1 || true
          fi
      - name: Get lecture
        run: |
          COURSE="https://ocw.mit.edu/courses/6-0001-introduction-to-computer-science-and-programming-in-python-fall-2016"
          N="${{ inputs.lecture }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 매일 다른 과목·강의 (server/scripts/open_courses.txt를 돌려 가며)
            mkdir -p /tmp/inbox
            python server/scripts/fetch_open_lecture.py --today server/scripts/open_courses.txt "$(( $(date +%s) / 86400 ))" /tmp/inbox
            echo "NAME=$(cat /tmp/inbox/name.txt)" >> "$GITHUB_ENV"
          elif [ -n "$N" ]; then
            echo "NAME=mit-6.0001-lec$N" >> "$GITHUB_ENV"
            python server/scripts/fetch_open_lecture.py --course "$COURSE" "$N" /tmp/inbox
          else
            echo "NAME=${{ inputs.name }}" >> "$GITHUB_ENV"
            python server/scripts/fetch_open_lecture.py "${{ inputs.slides }}" "${{ inputs.video }}" /tmp/inbox
          fi
      - name: Cut audio
        run: |
          LIMIT=""
          MIN="${{ inputs.minutes || '15' }}"
          echo "MINUTES=$MIN" >> "$GITHUB_ENV"
          if [ "$MIN" != "0" ]; then LIMIT="-t $(( MIN * 60 ))"; fi
          ffmpeg -loglevel error -i /tmp/inbox/video.mp4 $LIMIT -vn -ac 1 -ar 16000 -c:a aac -b:a 64k /tmp/inbox/lecture.m4a
          ls -la /tmp/inbox
      - name: Process
        working-directory: server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MAX_RETRIES: "20"
          TRAINING_LOG: "1"
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "::error::GROQ_API_KEY secret이 없습니다"; exit 1; fi
          (ENABLE_WEB_TIPS=0 uvicorn app.main:app --port 8000 --timeout-keep-alive 120 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:8000/health > /dev/null && break; sleep 1; done
          set -o pipefail
          python scripts/process_recording.py /tmp/inbox/slides.pdf /tmp/inbox/lecture.m4a /tmp/result --ask "방금 설명한 거 쉽게 다시 설명해 줘" 2>&1 | tee /tmp/run.txt
      - name: Score transcript
        if: always()
        working-directory: server
        run: |
          CAP=$(ls /tmp/inbox/captions.* 2>/dev/null | head -1)
          if [ -n "$CAP" ] && [ -f /tmp/result/받아쓰기.txt ]; then
            python scripts/score_transcript.py "$CAP" /tmp/result "$MINUTES" /tmp/inbox/slides.pdf
          else
            echo "자막이나 받아쓰기가 없어 정확도는 재지 않았어요"
          fi
          # 쪽 추적: 영상 화면과 강의자료를 그림으로 맞춘 정답과 비교
          if [ -f /tmp/result/받아쓰기.txt ]; then
            python scripts/slide_truth.py /tmp/inbox/video.mp4 /tmp/inbox/slides.pdf /tmp/result "$MINUTES" || echo "쪽 정답 만들기 실패"
          fi
      - name: Hindsight answers and save training data
        if: always()
        working-directory: server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/relabel_hindsight.py --limit 150 || echo "다 보고 쓴 정답 만들기 일부 실패"
          python scripts/export_training.py --out ../training/data
          rm -rf /tmp/branch && mkdir -p /tmp/branch/raw /tmp/branch/data
          cp data/training/raw-*.jsonl /tmp/branch/raw/ 2>/dev/null || true
          cp ../training/data/*.jsonl /tmp/branch/data/ 2>/dev/null || true
          printf '# 우리 AI 학습 데이터\n연습 강의(Make training data)와 공개 강의(Open lecture test)에서 모은 것. 진짜 수업 녹음은 올리지 않는다.\n' > /tmp/branch/README.md
          cd /tmp/branch && git init -q -b training-data && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "학습 데이터: 공개 강의 $NAME"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" training-data
      - name: Upload result
        if: always()
        run: |
          mkdir -p /tmp/result && cd /tmp/result
          cp /tmp/server.log server.log 2>/dev/null || true
          cp /tmp/inbox/slides.pdf 강의자료.pdf 2>/dev/null || true
          cp /tmp/inbox/captions.* . 2>/dev/null || true
          printf '출처: MIT OpenCourseWare (%s)\n라이선스: CC BY-NC-SA 4.0 (비영리 테스트용)\n' "$NAME" > 출처.txt
          git init -q -b result
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "open lecture result: $NAME"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:result/$NAME"
      - name: Server errors
        if: always()
        run: grep -E -B2 -A20 "Traceback|ERROR" /tmp/server.log | tail -120 || echo "서버 오류 없음"
