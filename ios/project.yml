# XcodeGen 설정. Mac에서 `brew install xcodegen && xcodegen` 을 실행하면 LectureNotes.xcodeproj 가 생긴다.
name: LectureNotes
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LectureNotes:
    type: application
    platform: iOS
    sources: [LectureNotes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lecturenotes
        DEVELOPMENT_LANGUAGE: ko
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: LectureNotes/Info.plist
      properties:
        CFBundleDisplayName: 강의노트
        # 날짜·시간 표기와 시스템 문구를 한국어로
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 강의를 녹음해서 받아쓰고 필기를 만들기 위해 마이크를 사용합니다.
        NSSpeechRecognitionUsageDescription: 교수님 말씀을 글자로 받아쓰기 위해 음성 인식을 사용합니다.
        NSLocalNetworkUsageDescription: 개발 중에는 같은 Wi-Fi의 서버에 연결합니다.
        # 화면이 꺼지거나 다른 앱으로 넘어가도 녹음을 이어간다
        UIBackgroundModes: [audio]
        # 개발용: http 로컬 서버 접속 허용. 출시 전에는 https 서버로 바꾸고 이 항목을 지운다.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
